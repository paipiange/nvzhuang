services:
  costume-tryon:
    build:
      context: .
      dockerfile: manifest/docker/Dockerfile
    container_name: costume-tryon-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: ./.env
        required: false
    environment:
      # 可在当前目录创建 .env 文件注入，或直接修改
      - NVZHUANG_SERVER_ADDRESS=${NVZHUANG_SERVER_ADDRESS:-:8000}
      - NVZHUANG_OBSERVABILITY_METRICS_ENABLED=${NVZHUANG_OBSERVABILITY_METRICS_ENABLED:-true}
      - NVZHUANG_OBSERVABILITY_ALLOW_REMOTE_METRICS=${NVZHUANG_OBSERVABILITY_ALLOW_REMOTE_METRICS:-false}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ARK_API_KEY=${ARK_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - SEEDUPLEX_API_KEY=${SEEDUPLEX_API_KEY:-}
      - TRYON_API_KEYS=${TRYON_API_KEYS:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
