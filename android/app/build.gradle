plugins {
    id 'com.android.application'
}

android {
    namespace 'com.paipiange.nvzhuang'
    compileSdk 34

    defaultConfig {
        applicationId "com.paipiange.nvzhuang"
        minSdk 24
        targetSdk 34
        versionCode 100
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (file("release.jks").exists()) {
                storeFile file("release.jks")
                storePassword System.getenv("KEYSTORE_PASSWORD") ?: "nvzhuang123456"
                keyAlias System.getenv("KEY_ALIAS") ?: "paipiange"
                keyPassword System.getenv("KEY_PASSWORD") ?: "nvzhuang123456"
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.activity:activity:1.8.2'
}
