name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-safety:
    name: Repository safety checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Reject committed credentials and private paths
        shell: bash
        run: |
          set -euo pipefail

          if git grep -nE '(sk-[A-Za-z0-9]{20,}|AIza[A-Za-z0-9]{20,})' -- . ':!*.lock'; then
            echo 'Detected a credential-like value in the repository.' >&2
            exit 1
          fi

          if git grep -nE '[A-Za-z]:\\\\(Users|Documents and Settings)\\\\' -- .; then
            echo 'Detected a private absolute Windows path in the repository.' >&2
            exit 1
          fi

  frontend:
    name: Frontend quality gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.10.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile --registry=https://registry.npmjs.org

      - name: Prepare public environment template
        run: |
          if [ ! -f env/.env ]; then
            cp env/.env.example env/.env
          fi

      - name: Build H5 bundle and generated route types
        run: pnpm build:h5

      - name: Run static checks
        run: |
          pnpm type-check
          pnpm lint:ci

      - name: Run unit tests
        run: pnpm test:run

      - name: Run browser flow tests
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e

      - name: Upload H5 bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: h5-bundle
          path: app/dist/build/h5
          if-no-files-found: error
          retention-days: 7

  backend:
    name: Backend quality gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Prepare backend config template
        run: cp manifest/config/config.example.yaml manifest/config/config.yaml

      - name: Verify modules
        run: go mod verify

      - name: Run backend tests
        run: go test ./...

      - name: Run backend vet
        run: go vet ./...

  android-debug:
    name: Android debug package
    runs-on: ubuntu-latest
    needs:
      - repository-safety
      - frontend
      - backend
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download H5 bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: h5-bundle
          path: android/app/src/main/assets/www

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Test, lint, and build debug APK
        working-directory: android
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nvzhuang-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
